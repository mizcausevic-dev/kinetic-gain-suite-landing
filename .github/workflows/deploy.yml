name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Hourly self-heal: if a push deploy gets blocked by the Hostinger FTP
  # auth throttle (530 Login incorrect, see memory entry "Hostinger FTP cap
  # behavior"), the next cron tick redeploys HEAD without needing a new
  # commit. Same pattern as apex deploy.yml line 68-69.
  schedule:
    - cron: "13 * * * *"

permissions:
  contents: read

concurrency:
  group: kinetic-gain-suite-landing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP-sync static site to suite.kineticgain.com
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Kodee diagnostic battery — runner-to-Hostinger network path
        run: |
          # Install nc + openssl if missing (ubuntu-latest has them by default)
          which nc openssl nslookup || sudo apt-get install -y netcat-openbsd openssl dnsutils 2>&1 | tail -3

          IP=$(curl -s --max-time 10 https://api.ipify.org)
          echo "============================================================"
          echo "RUNNER PUBLIC IPv4: $IP    /24: $(echo $IP | awk -F. '{print $1"."$2"."$3".0/24"}')"
          echo "============================================================"
          echo ""

          echo "############## 1. DNS RESOLUTION ##############"
          echo "--- nslookup ftp.kineticgain.com ---"
          nslookup ftp.kineticgain.com || echo "(nslookup failed)"
          echo ""
          echo "--- nslookup kineticgain.com ---"
          nslookup kineticgain.com || echo "(nslookup failed)"
          echo ""

          echo "############## 2. HTTPS (port 443) ##############"
          echo "--- curl -Iv --connect-timeout 10 https://kineticgain.com/kinetic-gain-canonical.json ---"
          curl -Iv --connect-timeout 10 --max-time 30 https://kineticgain.com/kinetic-gain-canonical.json 2>&1 | head -25 || echo "(curl failed with exit $?)"
          echo ""

          echo "############## 3. TCP CONNECT — FTP (port 21) ##############"
          echo "--- nc -vz ftp.kineticgain.com 21 (15s timeout) ---"
          timeout 15 nc -vz ftp.kineticgain.com 21 2>&1 || echo "(nc port 21 failed with exit $?)"
          echo ""

          echo "############## 4. TCP CONNECT — HTTPS (port 443) ##############"
          echo "--- nc -vz kineticgain.com 443 (15s timeout) ---"
          timeout 15 nc -vz kineticgain.com 443 2>&1 || echo "(nc port 443 failed with exit $?)"
          echo ""

          echo "############## 5. FTPS HANDSHAKE — openssl s_client ##############"
          echo "--- openssl s_client -starttls ftp -connect ftp.kineticgain.com:21 -brief (30s timeout) ---"
          timeout 30 openssl s_client -starttls ftp -connect ftp.kineticgain.com:21 -brief < /dev/null 2>&1 | head -30 || echo "(openssl s_client failed with exit $?)"
          echo ""

          echo "############## 6. SSH PORT 22 (alternative deploy path) ##############"
          echo "--- nc -vz ftp.kineticgain.com 22 (15s timeout) ---"
          timeout 15 nc -vz ftp.kineticgain.com 22 2>&1 || echo "(nc port 22 failed with exit $?)"
          echo ""
          echo "--- nc -vz kineticgain.com 22 (web host SSH attempt) ---"
          timeout 15 nc -vz kineticgain.com 22 2>&1 || echo "(nc port 22 to web host failed with exit $?)"
          echo ""
          echo "--- SSH version probe (any response = SSH service is alive) ---"
          timeout 15 bash -c 'exec 3<>/dev/tcp/ftp.kineticgain.com/22; head -1 <&3' 2>&1 || echo "(SSH version probe failed)"
          echo ""
          echo "--- Hostinger SSH usually on port 65002 — testing that too ---"
          timeout 15 nc -vz ftp.kineticgain.com 65002 2>&1 || echo "(port 65002 failed with exit $?)"
          timeout 15 nc -vz kineticgain.com 65002 2>&1 || echo "(port 65002 to web host failed with exit $?)"
          echo ""

          echo "============================================================"
          echo "DIAGNOSTIC COMPLETE — runner IP $IP"
          echo "============================================================"

      - name: Verify site root contains Suite landing
        run: |
          test -f index.html || (echo "FAIL: no index.html at repo root" && exit 1)
          grep -q "Kinetic Gain Protocol Suite" index.html || (echo "FAIL: index.html does not contain Kinetic Gain Protocol Suite" && exit 1)
          echo "OK: site root verified"
          ls -lah

      - name: Fetch apex canonical + emit splice payloads
        # SoT = kinetic-gain-canonical.json, published live at
        # https://kineticgain.com/kinetic-gain-canonical.json by the apex deploy.
        # We fetch the public URL (not the private GH repo) so this workflow
        # needs no cross-repo PAT. Whenever apex updates the canonical and
        # redeploys, the next suite-hub deploy picks up the new scalars
        # automatically — that's the Phase C "auto-flow" guarantee.
        run: |
          mkdir -p /tmp/apex/generated
          # Hostinger's edge WAF returns 403 to default curl UA from GitHub
          # Actions runner IPs. Use a real browser UA + Accept header.
          # If still 403, fall back to the in-repo last-known canonical scalars
          # so the deploy still succeeds (degraded mode — stats just won't update).
          if curl -fsS \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Accept: application/json,*/*" \
              -o /tmp/apex/kinetic-gain-canonical.json \
              https://kineticgain.com/kinetic-gain-canonical.json; then
            echo "OK: fetched canonical from kineticgain.com (apex live)"
          else
            echo "::warning::Could not fetch canonical from apex (HTTP failure). Splice step will skip."
            exit 0
          fi
          # Guard against empty/invalid JSON.
          python3 -c "import json; json.load(open('/tmp/apex/kinetic-gain-canonical.json'))" || {
            echo "::warning::Canonical JSON invalid; aborting splice"; exit 0; }
          python3 <<'PY'
          import json, pathlib
          canon = json.load(open("/tmp/apex/kinetic-gain-canonical.json", encoding="utf-8"))
          hstats = canon["headline_stats"]
          pstats = canon["pulse_stats"]
          mstats = canon["mcp_server"]
          out = pathlib.Path("/tmp/apex/generated")
          measured = canon.get("updated", "2026-06-04")
          # Plain-text scalar (for llms.txt — no <span> wrapper).
          (out / "live-properties-count.txt").write_text(str(hstats["live_properties"]) + "\n", encoding="utf-8", newline="\n")
          # HTML-wrapped scalars (mirror apex generated/pulse-universe-count.html shape).
          (out / "live-properties-count.html").write_text(
              f'<!-- GENERATED from canonical.json — do not hand-edit -->\n'
              f'<span class="kg-live-properties" data-measured="{measured}">{hstats["live_properties"]}</span>\n',
              encoding="utf-8", newline="\n"
          )
          (out / "pulse-universe-count.html").write_text(
              f'<!-- GENERATED from canonical.json — do not hand-edit -->\n'
              f'<span class="kg-pulse-universe" data-measured="{pstats.get("measured", measured)}">{pstats["universe_size"]:,}</span>\n',
              encoding="utf-8", newline="\n"
          )
          # mcp-kinetic-gain tests-passing tile (mcp/index.html). Keeps the tile's
          # stat-num class; mirrors the kg-* scalar shape above.
          (out / "tests-passing.html").write_text(
              f'<!-- GENERATED from canonical.json — do not hand-edit -->\n'
              f'<span class="stat-num" data-measured="{mstats.get("measured", measured)}">{mstats["tests_passing"]}</span>\n',
              encoding="utf-8", newline="\n"
          )
          print(f"OK: canonical v{canon['version']} ({canon['updated']}) -> live_properties={hstats['live_properties']} pulse_universe={pstats['universe_size']:,} tests_passing={mstats['tests_passing']}")
          PY
          ls -la /tmp/apex/generated/

      - name: Splice canonical stats into index.html + llms.txt
        # Marker-based replacement between <!-- BEGIN GENERATED X --> and
        # <!-- END GENERATED X -->. Mirrors the apex deploy.yml splice pattern
        # (mizcausevic-dev/kineticgain-com-apex .github/workflows/deploy.yml).
        # CI rewrites the in-tree files before FTP upload — repo content drifts
        # back to canonical every deploy without committing the stat values.
        # Skips gracefully if the canonical fetch step failed (degraded mode —
        # the last-committed scalar values stay live, deploy still proceeds).
        run: |
          if [ ! -f /tmp/apex/generated/live-properties-count.html ]; then
            echo "::warning::No canonical splice payloads — skipping splice. In-repo scalars will deploy as-is."
            exit 0
          fi
          python3 <<'PY'
          import pathlib
          # (target, begin_marker_prefix, end_marker, source file)
          SPLICES = [
              ("index.html", "<!-- BEGIN GENERATED live-properties-count", "<!-- END GENERATED live-properties-count -->", "/tmp/apex/generated/live-properties-count.html"),
              ("index.html", "<!-- BEGIN GENERATED pulse-universe-count",  "<!-- END GENERATED pulse-universe-count -->",  "/tmp/apex/generated/pulse-universe-count.html"),
              ("llms.txt",   "<!-- BEGIN GENERATED live-properties-count", "<!-- END GENERATED live-properties-count -->", "/tmp/apex/generated/live-properties-count.txt"),
              ("mcp/index.html", "<!-- BEGIN GENERATED tests-passing", "<!-- END GENERATED tests-passing -->", "/tmp/apex/generated/tests-passing.html"),
          ]
          targets = {}
          for tgt, begin_prefix, end_marker, src_file in SPLICES:
              if tgt not in targets:
                  targets[tgt] = open(tgt, encoding="utf-8").read()
              src = targets[tgt]
              new = open(src_file, encoding="utf-8").read().strip()
              # For HTML-wrapped source files, strip the "<!-- GENERATED ... -->" header
              # line so we splice just the payload.
              if new.startswith("<!-- GENERATED"):
                  new = new.split("\n", 1)[1].strip()
              i = src.find(begin_prefix)
              j = src.find(end_marker, i)
              if i < 0 or j < 0:
                  raise SystemExit(f"FAIL: markers missing in {tgt} for {src_file}: begin={i} end={j}")
              i_end_of_begin = src.find("-->", i) + len("-->")
              src = src[:i_end_of_begin] + new + src[j:]
              targets[tgt] = src
              print(f"OK: spliced {len(new)} bytes from {src_file} into {tgt}")
          for tgt, src in targets.items():
              pathlib.Path(tgt).write_text(src, encoding="utf-8", newline="\n")
              print(f"OK: wrote {tgt}")
          PY
          # Sanity-check the fingerprints landed.
          grep -q 'class="kg-live-properties"' index.html || { echo "FAIL: kg-live-properties span missing from index.html post-splice"; exit 1; }
          grep -q 'class="kg-pulse-universe"' index.html  || { echo "FAIL: kg-pulse-universe span missing from index.html post-splice"; exit 1; }
          echo "OK: stat splices verified in index.html + llms.txt"

      - name: Guard against stale literals (canonical-driven, assert-only)
        # Regression guard. Reads the authoritative counts from the canonical
        # JSON already fetched to /tmp/apex/ and FAILS the build (exit 1) if the
        # committed HTML still carries a stale literal that drifted from canonical.
        # Mirrors the "Verify site root" grep||exit 1 gate. Runs AFTER the splice
        # (so it validates exactly the bytes that will be uploaded) and BEFORE the
        # SFTP step. A fetch / canonical-shape problem degrades like the splice
        # step (::warning:: + exit 0); only a real stale literal hard-fails.
        run: |
          if [ ! -f /tmp/apex/kinetic-gain-canonical.json ]; then
            echo "::warning::Canonical not fetched; skipping stale-literal guard (degraded mode, deploy proceeds)."
            exit 0
          fi
          python3 <<'PY'
          import json, re, sys, pathlib
          try:
              canon = json.load(open("/tmp/apex/kinetic-gain-canonical.json", encoding="utf-8"))
              OPEN_SPECS = canon["headline_stats"]["open_specs"]      # 16  published open-spec catalog
              IMPL_SPECS = len(canon["mcp_server"]["specs_covered"])  # 12  specs the MCP server implements
              PRODUCERS  = canon["audit_stream"]["producer_repos"]    # 9   audit-stream producer repos
          except Exception as e:
              print(f"::warning::Canonical missing expected keys ({e}); skipping guard (degraded mode).")
              sys.exit(0)

          FILES = ["index.html", "mcp/index.html"]
          blobs = {f: pathlib.Path(f).read_text(encoding="utf-8") for f in FILES}
          fails = []

          # (1) Catalog/implemented collision: the body must never pair a spec
          # count with "open". "N open specifications" is the HEAD catalog framing
          # (open_specs); the implemented surface is IMPL_SPECS specs. Head only
          # ever says "16 open", so a whole-file scan == a body scan in practice.
          for f, s in blobs.items():
              for m in re.finditer(r"(?i)\b(twelve|12)\s+open\b", s):
                  fails.append(
                      f"{f}: '{m.group(0)}': body must not pair a spec count with 'open'. "
                      f"The {OPEN_SPECS}-open-spec catalog framing belongs to head meta only; "
                      f"the implemented specs number {IMPL_SPECS}.")

          # (2) Any "N producers" claim must equal canonical audit_stream.producer_repos.
          WORDNUM = {"seven": 7, "eight": 8, "nine": 9, "ten": 10, "eleven": 11, "twelve": 12}
          for f, s in blobs.items():
              for m in re.finditer(r"(?i)\b(\d{1,3}|seven|eight|nine|ten|eleven|twelve)\s+producers\b", s):
                  tok = m.group(1).lower()
                  val = int(tok) if tok.isdigit() else WORDNUM[tok]
                  if val != PRODUCERS:
                      fails.append(
                          f"{f}: '{m.group(0)}' but canonical audit_stream.producer_repos = {PRODUCERS} "
                          f"(write '{PRODUCERS} producers').")

          # (3) Retired literals that must never reappear in committed HTML. These
          # are hand-typed stale numbers the splice does not own; word-boundaried
          # so e.g. 1265 / 5554 do not match.
          RETIRED = {"126": "old tests-passing count", "555": "old public-repo count", "834": "old pulse universe size"}
          for f, s in blobs.items():
              for lit, what in RETIRED.items():
                  if re.search(r"(?<!\d)" + lit + r"(?!\d)", s):
                      fails.append(
                          f"{f}: retired literal '{lit}' ({what}) present; it was replaced by a "
                          f"canonical-spliced value; delete the hand-typed stale number.")

          if fails:
              print("STALE-LITERAL GUARD FAILED. Committed HTML drifted from canonical:")
              for x in fails:
                  print("  - " + x)
              sys.exit(1)
          print(f"OK: stale-literal guard passed (open_specs={OPEN_SPECS}, implemented_specs={IMPL_SPECS}, "
                f"producer_repos={PRODUCERS}; no 'eleven/11 open', no off-count producers, no 126/555/834).")
          PY

      # ---- SFTP via port 65002 (Hostinger's documented SSH port) ----
      # Bypasses the FTP-port-21 IP-reputation firewall that blocks GH-hosted
      # runners. Uses the SAME credentials as FTP — Hostinger's master user
      # works for both FTP and SFTP/SSH on the Cloud Professional plan.
      # Diagnostic on 2026-06-04 confirmed port 65002 reachable while port 21
      # is intermittently blocked. Inline lftp invocation avoids third-party
      # action dependency for higher reliability.
      # ---- SFTP via port 65002 with SSH KEY auth ----
      # Uses Hostinger's SSH service (enabled in hPanel 2026-06-04). SSH key
      # is registered in hPanel under "SSH Keys" + the matching private key
      # is stored as repo secret SSH_PRIVATE_KEY. No password ever leaves the
      # runner.
      #
      # Why this works around the GH Actions IP-reputation block: Hostinger's
      # WAF blocks port 21 from flagged Azure IPs as anti-FTP-brute-force,
      # but port 65002 (SSH) is on a different filter path. Even if SOME
      # runners get blocked, key auth makes per-run success less random
      # since we don't waste budget on retries that fail at auth.
      # Use webfactory/ssh-agent — loads the key directly into ssh-agent
      # via the SSH_AUTH_SOCK protocol, avoiding any printf / file-write
      # byte-mangling. This was the suspected cause of "Permission denied
      # (publickey)" on clean-runner-IP attempts where the connection reached
      # Hostinger but the key wasn't accepted. SHA pinned per repo standing rule.
      - name: Load SSH key into ssh-agent (webfactory)
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387  # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Seed known_hosts for ftp.kineticgain.com:65002
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          HOST="${FTP_HOST#ftp://}"; HOST="${HOST#sftp://}"; HOST="${HOST%/}"
          # ssh-keyscan may fail on TCP-blocked runner IPs; allow that — the
          # next deploy step will reuse this known_hosts if seeded, or fall
          # back to accept-new which writes one on first successful connect.
          ssh-keyscan -p 65002 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "known_hosts seeded for $HOST:65002"

      - name: SFTP-Deploy to /suite/ via tar | ssh
        id: deploy
        continue-on-error: true
        timeout-minutes: 10
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
        run: |
          set -euo pipefail
          HOST="${FTP_HOST#ftp://}"; HOST="${HOST#sftp://}"; HOST="${HOST%/}"

          # Tar local content (excluding repo metadata), pipe over SSH,
          # untar on server. ssh-agent provides the key via SSH_AUTH_SOCK —
          # no -i flag needed (and no on-disk private key to mishandle).
          tar --exclude='.git' --exclude='.github' --exclude='node_modules' \
              --exclude='CHANGELOG.md' --exclude='LICENSE' --exclude='README.md' \
              --exclude='docs' --exclude='.DS_Store' \
              -czf - . | \
          ssh -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -p 65002 \
              "$FTP_USER@$HOST" \
              'cd domains/kineticgain.com/public_html/suite/ && tar -xzf - && echo "DEPLOY_EXTRACTED"'
          echo "SFTP deploy complete."

      # 2026-07-11: port 65002 has been timing out on every push today
      # ("ssh: connect to host *** port 65002: Connection timed out") — the
      # hourly self-heal cron keeps hitting the same block. Same WAF-vs-runner-IP
      # problem apex's deploy.yml solved with an FTPS fallback on port 21
      # (apex commit history, ftps_fallback step) — port over the identical
      # pattern rather than inventing a new one. Only runs when the SSH path
      # failed; skipped entirely on a normal successful deploy.
      - name: FTPS-Deploy fallback to /suite/ (port 21)
        id: ftps_fallback
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 8
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib
          import os
          import pathlib
          import posixpath

          local_root = pathlib.Path(".")
          excludes = {".git", ".github", "node_modules", "CHANGELOG.md", "LICENSE", "README.md", "docs", ".DS_Store"}

          host = os.environ["FTP_HOST"]
          for prefix in ("ftp://", "ftps://", "sftp://"):
              if host.startswith(prefix):
                  host = host[len(prefix):]
          host = host.rstrip("/")

          user = os.environ["FTP_USER"]
          password = os.environ["FTP_PASS"]

          ftp = ftplib.FTP_TLS(timeout=60)
          ftp.connect(host=host, port=21)
          ftp.login(user=user, passwd=password)
          ftp.prot_p()
          ftp.set_pasv(True)

          def ensure_remote_dir(remote_dir: str) -> None:
              remote_dir = posixpath.normpath(remote_dir)
              if remote_dir in {"", ".", "/"}:
                  return
              current = ""
              for part in remote_dir.split("/"):
                  if not part:
                      continue
                  current += "/" + part
                  try:
                      ftp.mkd(current)
                  except ftplib.error_perm:
                      pass

          ftp.cwd("domains/kineticgain.com/public_html/suite")

          uploaded = 0
          for path in local_root.rglob("*"):
              if path.is_dir():
                  continue
              rel = path.relative_to(local_root)
              if excludes & set(rel.parts):
                  continue
              remote_path = posixpath.join(*rel.parts) if len(rel.parts) > 1 else rel.name
              remote_dir = posixpath.dirname(remote_path)
              if remote_dir:
                  ensure_remote_dir(remote_dir)
              with open(path, "rb") as fh:
                  ftp.storbinary(f"STOR {remote_path}", fh)
              uploaded += 1
          ftp.quit()
          print(f"OK: FTPS fallback uploaded {uploaded} files.")
          PY

      - name: Deploy result gate
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "::notice::SFTP (port 65002) upload OK."
          elif [ "${{ steps.ftps_fallback.outcome }}" = "success" ]; then
            echo "::notice::SSH port 65002 blocked; FTPS (port 21) fallback upload OK."
          else
            echo "::error::Both SFTP (65002) and FTPS (21) deploy paths failed — likely Hostinger WAF blocking this runner's IP on both ports. Retry via the hourly self-heal cron, or deploy from a non-GitHub-Actions IP."
            exit 1
          fi
