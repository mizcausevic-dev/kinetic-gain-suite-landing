name: Retired Suite deployment guard

# This repository is historical source. Its old workflow could deploy stale
# files to suite.kineticgain.com on a push to main, without a hosted byte gate.
# Keep a manual, visibly failing guard so no branch or push can publish it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kinetic-gain-suite-landing-retired
  cancel-in-progress: false

jobs:
  retired:
    name: BLOCKED — retired Suite source has no upload path
    runs-on: ubuntu-latest
    steps:
      - name: Stop before credentials or transfer
        run: |
          echo "::error::kinetic-gain-suite-landing is retired. This repository has no approved Suite deployment or rollback path. Review kg-suite-web and verify exact hosted bytes before a separate release."
          exit 1
